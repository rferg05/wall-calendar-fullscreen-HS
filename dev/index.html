<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Wall Calendar Full Screen preview</title>
    <!-- The host serves these itself and publishes them as --font-* on <body>;
         the preview stands in for that so the clock's Font setting can be seen. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Caveat:wght@400;700&family=Bebas+Neue&family=Playfair+Display:wght@400;700&family=Pacifico&display=swap" />
    <style>
      body {
        --font-inter: 'Inter'; --font-caveat: 'Caveat'; --font-bebas: 'Bebas Neue';
        --font-playfair: 'Playfair Display'; --font-pacifico: 'Pacifico';
      }
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        box-sizing: border-box;
        font-family: Inter, system-ui, sans-serif;
        background: #2b3a4a center / cover no-repeat;
      }
      /* Stand-ins for the rotating photo backgrounds: ?bg=bright|busy|dark|night */
      body.bright { background-image: linear-gradient(160deg, #f8fafc 0%, #e2e8f0 35%, #fde68a 70%, #fef3c7 100%); }
      body.busy { background-image:
        radial-gradient(circle at 20% 30%, #facc15 0 6%, transparent 7%),
        radial-gradient(circle at 70% 60%, #fde047 0 9%, transparent 10%),
        radial-gradient(circle at 45% 80%, #f8fafc 0 12%, transparent 13%),
        linear-gradient(180deg, #1f2d1f 0%, #64748b 55%, #e2e8f0 75%, #365314 100%); }
      body.night { background-image:
        linear-gradient(176deg, transparent 0 62%, rgba(251, 146, 60, 0.85) 63%, rgba(248, 250, 252, 0.9) 64.5%, transparent 66% 100%),
        linear-gradient(182deg, transparent 0 70%, rgba(239, 68, 68, 0.7) 71%, transparent 73% 100%),
        radial-gradient(ellipse at 50% 45%, #8a8f99 0 18%, #3a4150 30%, transparent 46%),
        linear-gradient(180deg, #0b1d4a 0%, #13254f 50%, #1b1b22 80%, #0d0d10 100%); }
      body.dark { background-image: linear-gradient(135deg, #2b3a4a 0%, #5a4a3a 50%, #1e2d24 100%); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
